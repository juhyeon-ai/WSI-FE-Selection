name: Synthetic workflow tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - name: Run the documented demo
        run: |
          python scripts/make_demo_features.py
          python -m suitability_score --feature-root runs/demo/features --output-dir runs/demo/scores
          python -m preprocessing --config configs/quickstart.json --dry-run
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
